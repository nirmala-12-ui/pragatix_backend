name: Build and Deploy

on:
  push:
    branches:
      - main

# Required for OIDC authentication
permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Configure AWS Credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::961408845745:role/jjcetpm-github-pipeline
          aws-region: ap-south-1

      - name: Push JAR to S3 bucket
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          for file in target/*.jar; do
            filename=$(basename "$file")
            name="${filename%.*}"
            aws s3 cp "$file" "s3://${{ vars.S3_BUCKET_NAME }}/backend/${name}_${TIMESTAMP}.jar"
          done
      # Finds instances by tag rather than a hardcoded ID, so this keeps
      # working when the ASG scales from 1 to 2 or replaces an instance.
      # Every instance the ASG launches needs App=pragatix set in
      # the Launch Template's tag specifications.
      - name: Discover running backend instances
        id: discover
        run: |
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:app,Values=pragatix" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)
          if [ -z "$INSTANCE_IDS" ]; then
            echo "::error::No running instances found with tag app=pragatix"
            exit 1
          fi
          echo "Found instances: $INSTANCE_IDS"
          echo "instance_ids=$INSTANCE_IDS" >> "$GITHUB_OUTPUT"
      - name: Deploy via SSM and wait for completion
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:app,Values=pragatix" \
            --parameters 'commands=[
              "sudo cloud-init clean",
              "sudo cloud-init init --local",
              "sudo cloud-init init",
              "sudo cloud-init modules --mode config",
              "sudo cloud-init modules --mode final"
            ]' \
            --timeout-seconds 600 \
            --comment "Pragatix deploy - commit ${{ github.sha }}" \
            --query "Command.CommandId" \
            --output text)
          echo "SSM Command ID: $COMMAND_ID"
          FAILED=0
          for id in ${{ steps.discover.outputs.instance_ids }}; do
            echo "Waiting for deploy on $id..."
            if aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$id"; then
              echo "Deploy succeeded on $id"
            else
              echo "::error::Deploy FAILED on instance $id"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" --instance-id "$id" \
                --query "StandardErrorContent" --output text
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1
