server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework
  tomcat:
    accesslog:
      enabled: false
      directory: access-logs
      prefix: access_log
      suffix: .log
      file-date-format: .yyyy-MM-dd
      pattern: '%h %l %u %t "%r" %s %b %D'
      rotate: true
      max-days: 7

spring:
  application:
    name: pragatix-backend
  main:
    banner-mode: "off"
    log-startup-info: false
  datasource:
    url: ${DB_URL:${PRAGATIX_DB_URL:jdbc:mysql://localhost:3307/spdms_lab?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}}
    username: ${DB_USERNAME:${PRAGATIX_DB_USERNAME:root}}
    password: ${DB_PASSWORD:${PRAGATIX_DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          time_zone: Asia/Kolkata

pragatix:
  datasource:
    url: ${DB_URL:${PRAGATIX_DB_URL:jdbc:mysql://localhost:3307/spdms_lab?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}}
    username: ${DB_USERNAME:${PRAGATIX_DB_USERNAME:root}}
    password: ${DB_PASSWORD:${PRAGATIX_DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver

neopat:
  datasource:
    url: ${NEOPAT_DB_URL:jdbc:mysql://localhost:3307/neopa_sms?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${NEOPAT_DB_USERNAME:${DB_USERNAME:root}}
    password: ${NEOPAT_DB_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  api-key: ${NEOPAT_API_KEY:neopat_super_secret_webhook_key_2026}

seed:
  play-review-student:
    enabled: ${SEED_PLAY_REVIEW_STUDENT_ENABLED:false}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_FROM_NUMBER:}
  test-phone-number: ${NEOPAT_TEST_PHONE_NUMBER:}

jwt:
  secret: ${JWT_SECRET:spdms_super_secret_key_must_be_at_least_256_bits_long_for_hs256_algorithm}
  expiration: ${JWT_EXPIRATION:57600000}
  student-expiration: ${JWT_STUDENT_EXPIRATION:57600000}

app:
  security:
    encryption:
      secret: ${DATABASE_ENCRYPTION_SECRET:PragatiXAES256GCMDatabaseEncryptionSecretKey2026!}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://pragatix.in,https://www.pragatix.in,*}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /api/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /api/swagger-ui.html
    tags-sorter: alpha

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
  level:
    root: WARN
    org.springframework: WARN
    org.springframework.boot: WARN
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.apache.catalina: WARN
    org.apache.tomcat: WARN
    com.zaxxer.hikari: WARN
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql: OFF
    org.hibernate: ERROR
    jjcet.PragatiX: INFO
    com.pragatix: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
  health:
    db:
      enabled: true

zepto:
  mail:
    url: ${ZEPTO_MAIL_URL:https://api.zeptomail.in/v1.1/email}
    token: ${ZEPTO_MAIL_TOKEN:}
    template-key: ${ZEPTO_MAIL_TEMPLATE_KEY:}
    sender-address: ${ZEPTO_MAIL_SENDER_ADDRESS:noreply@pragatix.in}
    sender-name: ${ZEPTO_MAIL_SENDER_NAME:PragatiX}

sms:
  provider: ${SMS_PROVIDER:AIRTEL}
  test-endpoint-enabled: ${SMS_TEST_ENDPOINT_ENABLED:false}

airtel:
  sms:
    enabled: ${AIRTEL_SMS_ENABLED:false}
    url: ${AIRTEL_SMS_URL:}
    customer-id: ${AIRTEL_CUSTOMER_ID:}
    username: ${AIRTEL_USERNAME:}
    password: ${AIRTEL_PASSWORD:}
    dlt-template-id: ${AIRTEL_DLT_TEMPLATE_ID:}
    entity-id: ${AIRTEL_ENTITY_ID:}
    source-address: ${AIRTEL_SOURCE_ADDRESS:}
    message-type: ${AIRTEL_MESSAGE_TYPE:1}
